<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex, nofollow">
<title>You're Registered! — CXO Off-Campus Houston</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
    background: #0F1629;
    color: #E8E8E8;
    line-height: 1.6;
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 20px;
  }
  .hero {
    background: linear-gradient(135deg, #0F1629 0%, #1a1f3a 50%, #0F1629 100%);
    padding: 80px 20px;
    text-align: center;
    border-bottom: 2px solid #00A99D;
    position: relative;
    overflow: hidden;
    border-radius: 12px;
    max-width: 700px;
    width: 100%;
  }
  .hero::before {
    content: '';
    position: absolute;
    top: -50%;
    right: -10%;
    width: 500px;
    height: 500px;
    background: radial-gradient(circle, rgba(0, 169, 157, 0.1) 0%, transparent 70%);
    border-radius: 50%;
    pointer-events: none;
  }
  .hero-content {
    position: relative;
    z-index: 2;
    max-width: 560px;
    margin: 0 auto;
  }
  .hero-emoji {
    font-size: 4rem;
    margin-bottom: 20px;
    display: block;
  }
